name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Merge Full Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 生成语言包
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
          
          # 2. 编译 (强制使用我们的配置，清理旧缓存)
          idf.py fullclean
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build
          
          # 3. 合并（使用 @flash_args 精准识别所有分区，避免找不到文件）
          cd build
          esptool.py --chip esp32s3 merge_bin -o otto-firmware-full.bin @flash_args

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/otto-firmware-full.bin
          if-no-files-found: error
