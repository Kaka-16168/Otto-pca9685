name: Build Otto-Robot Firmware

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-otto:
    name: Build Otto-Robot (esp32s3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (full submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 👇 已完全删除报错的探测脚本，直接对齐 xiaozhi-esp32 官方 CI 写法
      - name: Build Otto-Robot with ESP-IDF Action
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          path: xiaozhi-esp32
          command: idf.py -DBOARD_TYPE=otto-robot build

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: otto-robot-firmware-esp32s3
          path: |
            xiaozhi-esp32/build/*.bin
            xiaozhi-esp32/build/*.elf
            xiaozhi-esp32/build/bootloader/bootloader.bin
            xiaozhi-esp32/build/partition_table/partition-table.bin
            xiaozhi-esp32/build/flash_args
            xiaozhi-esp32/build/merged-binary.bin
            xiaozhi-esp32/releases/**/*.zip
          if-no-files-found: error
