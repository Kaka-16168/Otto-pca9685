name: Build Otto Firmware
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Merge
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 彻底清理
          rm -f sdkconfig sdkconfig.old
          idf.py fullclean
          
          # 2. 强制写入 S3 的配置文件（最高优先级，锁死配置）
          cat > sdkconfig.defaults.esp32s3 << EOF
CONFIG_IDF_TARGET="esp32s3"
CONFIG_BOARD_TYPE_OTTO_ROBOT=y
CONFIG_HTTPD_WS_SUPPORT=y
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
CONFIG_ESPTOOLPY_FLASHSIZE="16MB"
CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
CONFIG_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_SPEED_80M=y
CONFIG_SPIRAM_USE_MALLOC=y
CONFIG_LV_MEM_CUSTOM=y
CONFIG_LV_MEM_CUSTOM_INCLUDE="stdlib.h"
CONFIG_FLASH_DEFAULT_ASSETS=y
CONFIG_USE_DEFAULT_ASSETS=y
CONFIG_LANGUAGE_ZH_CN=y
CONFIG_USE_AFE_WAKE_WORD=n
CONFIG_USE_WAKENET=n
CONFIG_SR_WN_WN9_HIESP=n
CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS=n
CONFIG_USE_CUSTOM_WAKE_WORD=y
CONFIG_CUSTOM_WAKE_WORD="ka ka"
CONFIG_CUSTOM_WAKE_WORD_DISPLAY="卡卡"
CONFIG_SR_MN_CN_MULTINET7_QUANT=y
EOF
          
          # 3. 编译
          idf.py reconfigure
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
          idf.py build
          
          # 4. 寻找组件路径（使用 ls 代替 find，更稳定）
          echo "Managed components list:"
          ls -1 managed_components
          
          NOTO_PATH=$(ls -d managed_components/*xiaozhi-fonts* 2>/dev/null | head -n 1)
          ESP_SR_PATH=$(ls -d managed_components/*esp-sr*/model 2>/dev/null | head -n 1)
          
          echo "NOTO_PATH: $NOTO_PATH"
          echo "ESP_SR_PATH: $ESP_SR_PATH"
          
          # 5. 强制打包资源
          python scripts/build_default_assets.py \
            --output build/generated_assets.bin \
            --sdkconfig sdkconfig \
            --builtin_text_font font_noto_sans_basic_16_4 \
            --emoji_collection otto-gif \
            --esp_sr_model_path "$ESP_SR_PATH" \
            --noto_fonts_path "$NOTO_PATH"
          
          # 6. 合并固件
          cd build
          esptool.py --chip esp32s3 merge_bin -o otto-firmware-full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 xiaozhi.bin \
            0x810000 generated_assets.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/otto-firmware-full.bin
          if-no-files-found: error
