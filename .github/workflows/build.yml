name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Merge Full Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 清理一切旧缓存
          rm -f sdkconfig sdkconfig.old
          idf.py fullclean
          
          # 2. 生成语言包
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
          
          # 3. 编译主程序 (此时不会打包资源)
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build
          
          # 4. 【核心绝杀】手动调用官方脚本，强制生成包含字库和唤醒词的 assets.bin！
          # 这一步会生成 build/generated_assets.bin
          python scripts/build_default_assets.py --output build/generated_assets.bin --sdkconfig sdkconfig
          
          # 5. 检查资源包大小
          cd build
          ls -lh generated_assets.bin
          SIZE=$(stat -c%s generated_assets.bin)
          if [ "$SIZE" -lt 1500000 ]; then
            echo "❌ 资源包异常：大小仅有 $SIZE 字节！"
            exit 1
          fi
          
          # 6. 强制合并，一步到位
          esptool.py --chip esp32s3 merge_bin -o otto-firmware-full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 xiaozhi.bin \
            0x810000 generated_assets.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/otto-firmware-full.bin
          if-no-files-found: error
