name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build otto-robot variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          rm -f sdkconfig sdkconfig.old
          rm -rf build
          
          # 【魔法修复】安全地把拦截报错变成打印，绝对不破坏语法！
          python -c "
          with open('scripts/build.py', 'r') as f:
              content = f.read()
          content = content.replace('raise ValueError(', 'print(')
          with open('scripts/build.py', 'w') as f:
              f.write(content)
          "
          
        
          python scripts/build.py otto-robot --name otto-robot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
