name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Merge Full Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 彻底清理
          rm -f sdkconfig sdkconfig.old
          idf.py fullclean
          
          # 2. 生成语言包
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
          
          # 3. 编译主程序，生成 sdkconfig
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build
          
          # 4. 【核心修复】手动打包资源，严格传入字体、表情模型和正确路径！
          python scripts/build_default_assets.py \
            --output build/generated_assets.bin \
            --sdkconfig sdkconfig \
            --builtin_text_font font_noto_sans_basic_16_4 \
            --emoji_collection otto-gif \
            --esp_sr_model_path managed_components/espressif__esp-sr/model \
            --noto_fonts_path managed_components/xiaozhi-fonts
            
          # 5. 检查是否成功生成
          cd build
          ls -lh generated_assets.bin
          
          # 6. 强制合并
          esptool.py --chip esp32s3 merge_bin -o otto-firmware-full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 xiaozhi.bin \
            0x810000 generated_assets.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/otto-firmware-full.bin
          if-no-files-found: error
