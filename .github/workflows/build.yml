name: Build Otto Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-S3 Otto Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Build and Merge Firmware
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: xiaozhi-esp32
          command: |
            idf.py fullclean
            idf.py build
            cd build
            # 使用 esptool 手动合并，路径清晰明确
            esptool.py --chip esp32s3 merge_bin -o otto-firmware-full.bin \
              --flash_mode dio --flash_freq 80m --flash_size 16MB \
              0x0 bootloader/bootloader.bin \
              0x8000 partition_table/partition-table.bin \
              0xd000 ota_data_initial.bin \
              0x20000 xiaozhi.bin \
              0x600000 generated_assets.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-firmware-esp32s3
          path: xiaozhi-esp32/build/otto-firmware-full.bin
