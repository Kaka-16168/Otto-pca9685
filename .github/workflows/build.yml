name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Merge Full Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 彻底清理所有缓存和残留
          rm -f sdkconfig sdkconfig.old
          idf.py fullclean
          
          # 2. 【核心关键】重新配置，这一步会自动去 GitHub 拉取字体和表情等依赖组件！
          idf.py reconfigure
          
          # 3. 生成语言包
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
          
          # 4. 正式编译（此时 CMake 会读取 otto-robot 的配置，找到下载好的组件并打包资源）
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build
          
          # 5. 合并
          cd build
          ls -lh generated_assets.bin
          
          esptool.py --chip esp32s3 merge_bin -o otto-firmware-full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 xiaozhi.bin \
            0x810000 generated_assets.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/otto-firmware-full.bin
          if-no-files-found: error
