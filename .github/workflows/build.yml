name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Merge Full Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 生成语言包
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
          
          # 2. 强制清理缓存，直接使用 IDF 原生编译（绝对不会再拦唤醒词）
          idf.py fullclean
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build
          
          # 3. 使用官方自动合并命令，它会自动读取 DIO/40M 和所有文件地址
          idf.py merge-bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          # 官方 merge-bin 默认生成的文件名
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
