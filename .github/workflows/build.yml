name: Build Boards

on:
  workflow_dispatch: 
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Merge Full Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 手动生成语言配置文件
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
          
          # 2. 清理并编译
          idf.py fullclean
          idf.py -D SDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3" build
          
          # 3. 进入 build 目录，使用 @flash_args 自动合并
          cd build
          esptool.py --chip esp32s3 merge_bin -o otto-firmware-full.bin @flash_args

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/otto-firmware-full.bin
          if-no-files-found: error
