name: Build Otto Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-S3 Otto Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Build and Merge Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: xiaozhi-esp32   # 关键：告诉 Action 项目在这个子目录
          command: |
            idf.py fullclean
            idf.py build
            idf.py merge-bin -o build/merged-binary.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-firmware-esp32s3
          path: xiaozhi-esp32/build/merged-binary.bin
