name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and Merge Full Firmware
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 物理清理
          rm -f sdkconfig sdkconfig.old
          rm -rf build
          
          # 2. 强制生成配置文件（只留板型）
          cat > main/boards/otto-robot/config.json << 'EOF'
          {
            "type": "otto-robot",
            "target": "esp32s3",
            "builds": [
              {
                "name": "otto-robot",
                "sdkconfig_append": [
                  "CONFIG_BOARD_TYPE_OTTO_ROBOT=y"
                ]
              }
            ]
          }
          EOF
          
          # 3. 强行生成 S3 专属配置
          cat > sdkconfig.defaults.esp32s3 << 'EOF'
          CONFIG_IDF_TARGET="esp32s3"
          CONFIG_BOARD_TYPE_OTTO_ROBOT=y
          CONFIG_HTTPD_WS_SUPPORT=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_ESPTOOLPY_FLASHSIZE="16MB"
          CONFIG_PARTITION_TABLE_CUSTOM=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/16m.csv"
          CONFIG_PARTITION_TABLE_FILENAME="partitions/v2/16m.csv"
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
          CONFIG_SPIRAM=y
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_SPIRAM_SPEED_80M=y
          CONFIG_SPIRAM_USE_MALLOC=y
          CONFIG_FLASH_DEFAULT_ASSETS=y
          CONFIG_USE_DEFAULT_ASSETS=y
          CONFIG_LANGUAGE_ZH_CN=y
          CONFIG_USE_AFE_WAKE_WORD=n
          CONFIG_USE_WAKENET=n
          CONFIG_SR_WN_WN9_HIESP=n
          CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS=n
          CONFIG_USE_CUSTOM_WAKE_WORD=y
          CONFIG_CUSTOM_WAKE_WORD="ka ka"
          CONFIG_CUSTOM_WAKE_WORD_DISPLAY="卡卡"
          CONFIG_SR_MN_CN_MULTINET7_QUANT=y
          EOF
          
          # 4. 【核心修复 1】强制设定目标芯片为 esp32s3！防止编译出 esp32 的 bootloader
          idf.py set-target esp32s3
          
          # 5. 生成语言包并编译
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.out
          python scripts/gen_lang.py --language zh-CN --output main/assets/lang_config.h
          idf.py build
          
          # 6. 【核心修复 2】放弃 find 路径，直接用默认标准路径强行打包！
          # 只要 idf.py build 成功，模型和字库一定在这两个固定路径里
          python scripts/build_default_assets.py \
            --output build/generated_assets.bin \
            --sdkconfig sdkconfig \
            --builtin_text_font font_noto_sans_basic_16_4 \
            --esp_sr_model_path managed_components/espressif__esp-sr/model \
            --noto_fonts_path managed_components/78__xiaozhi-fonts
          
          # 7. 检查资源包大小（必须大于 2MB）
          cd build
          ls -lh generated_assets.bin
          if [ $(stat -c%s generated_assets.bin) -lt 1500000 ]; then
            echo "❌ 资源包太小，模型没打进去！"
            exit 1
          fi
          
          # 8. 强制合并（此时包含正确的 S3 Bootloader）
          esptool.py --chip esp32s3 merge_bin -o otto-firmware-full.bin \
            --flash_mode dio --flash_freq 40m --flash_size 16MB \
            0x0 bootloader/bootloader.bin \
            0x8000 partition_table/partition-table.bin \
            0x10000 xiaozhi.bin \
            0x810000 generated_assets.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/otto-firmware-full.bin
          if-no-files-found: error
