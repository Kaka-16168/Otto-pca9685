name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build otto-robot variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 强制清理残留
          rm -f sdkconfig sdkconfig.old
          idf.py fullclean
          
          # 2. 【魔法修复】用 Python 安全地将拦截报错变成打印，绝对不破坏语法！
          python -c "
          with open('scripts/build.py', 'r') as f:
              content = f.read()
          content = content.replace('raise ValueError(', 'print(')
          with open('scripts/build.py', 'w') as f:
              f.write(content)
          "
          
          # 3. 跑官方脚本，让它自动设置 target 为 esp32s3，并自动打包资源！
          python scripts/build.py otto-robot --name otto-robot
          
          # 4. 如果官方脚本没有合并固件，我们手动合并（强制指定 esp32s3）
          if [ ! -f build/merged-binary.bin ]; then
            cd build
            esptool.py --chip esp32s3 merge_bin -o merged-binary.bin \
              --flash_mode dio --flash_freq 40m --flash_size 16MB \
              0x0 bootloader/bootloader.bin \
              0x8000 partition_table/partition-table.bin \
              0x10000 xiaozhi.bin \
              0x810000 generated_assets.bin
            cd ..
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
