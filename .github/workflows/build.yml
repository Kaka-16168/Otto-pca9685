name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build otto-robot variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 彻底清理所有历史缓存
          rm -f sdkconfig sdkconfig.old
          idf.py fullclean
          
          # 2. 【核心洗脑】用代码强制重写 config.json，把参数焊死！
          cat > main/boards/otto-robot/config.json << 'EOF'
          {
            "type": "otto-robot",
            "target": "esp32s3",
            "builds": [
              {
                "name": "otto-robot",
                "sdkconfig_append": [
                  "CONFIG_BOARD_TYPE_OTTO_ROBOT=y",
                  "CONFIG_USE_AFE_WAKE_WORD=n",
                  "CONFIG_USE_CUSTOM_WAKE_WORD=y",
                  "CONFIG_USE_WAKENET=n",
                  "CONFIG_SR_WN_WN9_HIESP=n",
                  "CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS=n",
                  "CONFIG_CUSTOM_WAKE_WORD=\"ka ka\"",
                  "CONFIG_CUSTOM_WAKE_WORD_DISPLAY=\"卡卡\"",
                  "CONFIG_SR_MN_CN_MULTINET7_QUANT=y",
                  "CONFIG_FLASH_DEFAULT_ASSETS=y",
                  "CONFIG_USE_DEFAULT_ASSETS=y"
                ]
              }
            ]
          }
          EOF
          
          # 3. 运行官方原版 build.py（配置全对，它绝对不会再报错，且会自动打包字库和模型）
          python scripts/build.py otto-robot --name otto-robot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
