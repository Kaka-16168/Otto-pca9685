name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build otto-robot variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 让 build.py 先生成基础的 sdkconfig
          idf.py reconfigure
          
          # 2. 【暴力硬改】直接修改生成的 sdkconfig 文件，神挡杀神！
          sed -i 's/CONFIG_LANGUAGE_EN_US=y/CONFIG_LANGUAGE_ZH_CN=y/g' sdkconfig
          sed -i 's/CONFIG_USE_AFE_WAKE_WORD=y/CONFIG_USE_AFE_WAKE_WORD=n/g' sdkconfig
          sed -i 's/CONFIG_SR_WN_WN9_HIESP=y/CONFIG_SR_WN_WN9_HIESP=n/g' sdkconfig
          sed -i 's/CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS=y/CONFIG_SR_WN_WN9_NIHAOXIAOZHI_TTS=n/g' sdkconfig
          sed -i 's/CONFIG_USE_CUSTOM_WAKE_WORD=n/CONFIG_USE_CUSTOM_WAKE_WORD=y/g' sdkconfig
          
          # 3. 强行追加自定义唤醒词和模型
          echo "CONFIG_CUSTOM_WAKE_WORD=\"ka ka\"" >> sdkconfig
          echo "CONFIG_CUSTOM_WAKE_WORD_DISPLAY=\"卡卡\"" >> sdkconfig
          echo "CONFIG_SR_MN_CN_MULTINET7_QUANT=y" >> sdkconfig
          
          # 4. 开始正常编译
          python scripts/build.py otto-robot --name otto-robot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
