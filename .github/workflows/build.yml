name: Build Boards

on:
  workflow_dispatch: 
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build otto-robot variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 使用官方脚本进行编译，它会自动处理资源包并生成完整的 bin
          python scripts/build.py otto-robot --name otto-robot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_${{ github.sha }}
          # 官方脚本通常会将合并后的固件放在这里
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
