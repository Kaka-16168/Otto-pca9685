name: Build Otto Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-S3 Otto Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: xiaozhi-esp32
          command: |
            idf.py fullclean
            idf.py build
        env:
          BOARD_TYPE: otto-robot

      - name: Merge Firmware
        run: |
          cd xiaozhi-esp32
          # 使用 idf.py merge-bin 命令，ESP-IDF v6 原生支持，无需手动指定 esptool 路径
          idf.py merge-bin -o build/otto-firmware-full.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-firmware-esp32s3
          path: xiaozhi-esp32/build/otto-firmware-full.bin
