name: Build Otto Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ESP32-S3 Otto Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Build and Merge Firmware
        uses: espressif/esp-idf-ci-action@v1.1.0
        with:
          esp_idf_version: v6.0.2
          target: esp32s3
          path: xiaozhi-esp32
          command: |
            idf.py fullclean
            idf.py build
            cd build
            # 使用官方命令，自动读取 flash_args 合并，无需手动写地址和文件名
            idf.py merge-bin -o otto-firmware-full.bin

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: otto-firmware-esp32s3
          path: xiaozhi-esp32/build/otto-firmware-full.bin
