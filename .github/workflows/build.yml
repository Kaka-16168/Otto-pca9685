name: Build Boards
on:
  workflow_dispatch: 
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build_otto:
    name: Build otto-robot
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build otto-robot variant
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          cd xiaozhi-esp32
          
          # 1. 物理删除可能残留的旧配置文件
          rm -f sdkconfig sdkconfig.old
          idf.py fullclean
          
          # 2. 【魔法一】强行覆盖你的 config.json，确保配置绝对纯净！
          cat > main/boards/otto-robot/config.json << 'EOF'
          {
            "type": "otto-robot",
            "target": "esp32s3",
            "builds": [
              {
                "name": "otto-robot",
                "sdkconfig_append": [
                  "CONFIG_BOARD_TYPE_OTTO_ROBOT=y",
                  "CONFIG_USE_AFE_WAKE_WORD=n",
                  "CONFIG_USE_CUSTOM_WAKE_WORD=y",
                  "CONFIG_CUSTOM_WAKE_WORD=\"ka ka\"",
                  "CONFIG_CUSTOM_WAKE_WORD_DISPLAY=\"卡卡\"",
                  "CONFIG_SR_MN_CN_MULTINET7_QUANT=y"
                ]
              }
            ]
          }
          EOF
          
          # 3. 【魔法二】强行注释掉 build.py 里拦截报错的代码，让它乖乖打包！
          sed -i 's/raise ValueError(/pass # raise ValueError(/g' scripts/build.py
          
          # 4. 运行官方脚本（现在配置被强制修正了，它绝对不报错，且会打包出巨大的资源文件）
          python scripts/build.py otto-robot --name otto-robot

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_otto-robot_full
          path: xiaozhi-esp32/build/merged-binary.bin
          if-no-files-found: error
